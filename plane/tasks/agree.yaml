# agree (ai-service-plane Req 5.3, 2.1): agreement across the two verify passes, per-candidate cost and turns,
# declared-site match. No model. This is the template the per-case Tasks of a Run are generated from (bound to the
# case's inputs Workspace for the candidates and declared sites). The image is digest-pinned.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: agree
  atespace: default
spec:
  image: "localhost:5001/ousast-runner@sha256:200e335877b52d68ea0bc53b4c9ba49ef2ee19e8a5ec2c874148b969123ef7ab"
  command: ["agree"]
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
