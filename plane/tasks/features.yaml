# features (learned-decision-engine design section 1): one allow-listed feature record per candidate. No model.
# The template of the per-case Tasks (bound to the case's vulnerable Workspace for the functions' spans and the
# entry-point distance); `remember` stores the records as `features` rows. The image is digest-pinned.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: features
  atespace: default
spec:
  image: "localhost:5001/ousast-runner@sha256:95edc7ed562189180a472df8115e6a90c8b4fcea47c06593395634bd56041bcb"
  command: ["features"]
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
