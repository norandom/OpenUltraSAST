# remember (harnessx-removal Req 6.1, design section 4): a case's delivered artifacts as memory rows. No model.
# The template of the per-case Tasks (bound to the case's vulnerable Workspace for the repository and pin the rows
# carry); the host ingests the delivered memory.jsonl after the Run. The image is digest-pinned.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: remember
  atespace: default
spec:
  image: "localhost:5001/ousast-runner@sha256:e9964977659c4dcea7d8b25390ca0e16368ac901dd076aa6138df8303a0bb699"
  command: ["remember"]
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
