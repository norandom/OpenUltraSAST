# alerts (harnessx-removal Req 6.3, design section 6): quick-mode rules (enabled and shadow) on a case's vulnerable
# and fixed pins, each alert attributed to its enclosing function and marked inside or outside the fix. No model.
# Heavy like repo-facts (a full-tree scan per pin): the Run serializes it. The image is digest-pinned.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: alerts
  atespace: default
spec:
  image: "localhost:5001/ousast-runner@sha256:7fbd523f127f1e15eddc48b06e73acf75fa70f741d36e0749e74ca883797f6c9"
  command: ["alerts"]
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1280Mi"
