# Breadth ledger: every spec and every top-level capability, with a status and the deletion that closes it.
# Draft 2026-10-13 from the 22 spec.json files and the Pathfinder feature inventory (PATHFINDER-2026-10-13/).
# Nothing here changes code; it records decisions so a gate can hold the line.
#
# status values
#   active    = on one of the four lines in .kiro/steering/overview.md (2026-10-13); work may land
#   done      = implemented and closed; the code it produced is owned by a capability below
#   parked    = no work lands; scaffolding (stubs, unused flags, dead task modules) is removed; spec stays as history
#   retiring  = the "closes" deletion is scheduled; the spec directory goes with it
#   review    = Pathfinder 2026-10-13 decides between parked and retiring
#   removed   = the "closes" deletion has run; the entry stays one release as the record of what went
#
# open_fronts (the weekly number) = specs with status active or review
#                                   + capabilities with status review or retiring whose "closes" has not run.
#
# gate (to implement after the map is approved):
#   fail when a spec.json reaches phase "tasks-generated" without an entry here;
#   fail when a new directory under src/openultrasast/ lands without a [capability.*] entry;
#   fail when an entry has status "retiring" for more than 14 days with its "closes" unexecuted.

[meta]
drafted = "2026-10-13"
spec_count = 22
open_fronts = 0   # filled by the gate script once it exists

