post_fix = "    public HttpResponse doNotifyCommit(HttpServletRequest request, @QueryParameter(required=true) String url,\n                                       @QueryParameter() String branches, @QueryParameter() String sha1,\n                                       @QueryParameter() String token) {\n        if (!\"disabled\".equalsIgnoreCase(NOTIFY_COMMIT_ACCESS_CONTROL)\n                && !\"disabled-for-polling\".equalsIgnoreCase(NOTIFY_COMMIT_ACCESS_CONTROL)) {\n            if (StringUtils.isEmpty(token)) {\n                return HttpResponses.errorWithoutStack(401, \"An access token is required. Please refer to Git plugin documentation for details.\");\n            }\n            if (!ApiTokenPropertyConfiguration.get().isValidApiToken(token)) {\n                return HttpResponses.errorWithoutStack(403, \"Invalid access token\");\n            }\n        }\n        if (\"disabled-for-polling\".equalsIgnoreCase(NOTIFY_COMMIT_ACCESS_CONTROL) && StringUtils.isNotEmpty(sha1)) {\n            if (StringUtils.isEmpty(token)) {\n                return HttpResponses.errorWithoutStack(401, \"An access token is required when using the sha1 parameter. Please refer to Git plugin documentation for details.\");\n            } \n            if (!ApiTokenPropertyConfiguration.get().isValidApiToken(token)) {\n                return HttpResponses.errorWithoutStack(403, \"Invalid access token\");\n            }\n        }\n        lastURL = url;\n        lastBranches = branches;\n        if(StringUtils.isNotBlank(sha1)&&!SHA1_PATTERN.matcher(sha1.trim()).matches()){\n            return HttpResponses.error(SC_BAD_REQUEST, new IllegalArgumentException(\"Illegal SHA1\"));\n        }\n        lastSHA1 = cleanupSha1(sha1);\n        lastBuildParameters = null;\n        GitStatus.clearLastStaticBuildParameters();\n        URIish uri;\n        List<ParameterValue> buildParameters = new ArrayList<>();\n\n        try {\n            uri = new URIish(url);\n        } catch (URISyntaxException e) {\n            return HttpResponses.error(SC_BAD_REQUEST, new Exception(\"Illegal URL: \" + url, e));\n        }\n\n        if (allowNotifyCommitParameters || !safeParameters.isEmpty()) { // Allow SECURITY-275 bug\n            final Map<String, String[]> parameterMap = request.getParameterMap();\n            for (Map.Entry<String, String[]> entry : parameterMap.entrySet()) {\n                if (!(entry.getKey().equals(\"url\")) && !(entry.getKey().equals(\"branches\")) && !(entry.getKey().equals(\"sha1\")))\n                    if (entry.getValue()[0] != null && (allowNotifyCommitParameters || safeParameters.contains(entry.getKey())))\n                        buildParameters.add(new StringParameterValue(entry.getKey(), entry.getValue()[0]));\n            }\n        }\n        lastBuildParameters = buildParameters;\n\n        branches = Util.fixEmptyAndTrim(branches);\n\n        String[] branchesArray;\n        if (branches == null) {\n            branchesArray = new String[0];\n        } else {\n            branchesArray = branches.split(\",\");\n        }\n\n        final List<ResponseContributor> contributors = new ArrayList<>();\n        Jenkins jenkins = Jenkins.get();\n        String origin = SCMEvent.originOf(request);\n        for (Listener listener : jenkins.getExtensionList(Listener.class)) {\n            contributors.addAll(listener.onNotifyCommit(origin, uri, sha1, buildParameters, branchesArray));\n        }\n\n        return (StaplerRequest req, StaplerResponse rsp, Object node) -> {\n            rsp.setStatus(SC_OK);\n            rsp.setContentType(\"text/plain\");\n            for (int i = 0; i < contributors.size(); i++) {\n                if (i == MAX_REPORTED_CONTRIBUTORS) {\n                    rsp.addHeader(\"Triggered\", \"<\" + (contributors.size() - i) + \" more>\");\n                    break;\n                } else {\n                    contributors.get(i).addHeaders(req, rsp);\n                }\n            }\n            PrintWriter w = rsp.getWriter();\n            for (ResponseContributor c : contributors) {\n                c.writeBody(req, rsp, w);\n            }\n        };\n    }"
pre_fix = "    public HttpResponse doNotifyCommit(HttpServletRequest request, @QueryParameter(required=true) String url,\n                                       @QueryParameter(required=false) String branches,\n                                       @QueryParameter(required=false) String sha1) throws ServletException, IOException {\n        lastURL = url;\n        lastBranches = branches;\n        if(StringUtils.isNotBlank(sha1)&&!SHA1_PATTERN.matcher(sha1.trim()).matches()){\n            return HttpResponses.error(SC_BAD_REQUEST, new IllegalArgumentException(\"Illegal SHA1\"));\n        }\n        lastSHA1 = cleanupSha1(sha1);\n        lastBuildParameters = null;\n        GitStatus.clearLastStaticBuildParameters();\n        URIish uri;\n        List<ParameterValue> buildParameters = new ArrayList<>();\n\n        try {\n            uri = new URIish(url);\n        } catch (URISyntaxException e) {\n            return HttpResponses.error(SC_BAD_REQUEST, new Exception(\"Illegal URL: \" + url, e));\n        }\n\n        if (allowNotifyCommitParameters || !safeParameters.isEmpty()) { // Allow SECURITY-275 bug\n            final Map<String, String[]> parameterMap = request.getParameterMap();\n            for (Map.Entry<String, String[]> entry : parameterMap.entrySet()) {\n                if (!(entry.getKey().equals(\"url\")) && !(entry.getKey().equals(\"branches\")) && !(entry.getKey().equals(\"sha1\")))\n                    if (entry.getValue()[0] != null && (allowNotifyCommitParameters || safeParameters.contains(entry.getKey())))\n                        buildParameters.add(new StringParameterValue(entry.getKey(), entry.getValue()[0]));\n            }\n        }\n        lastBuildParameters = buildParameters;\n\n        branches = Util.fixEmptyAndTrim(branches);\n\n        String[] branchesArray;\n        if (branches == null) {\n            branchesArray = new String[0];\n        } else {\n            branchesArray = branches.split(\",\");\n        }\n\n        final List<ResponseContributor> contributors = new ArrayList<>();\n        Jenkins jenkins = Jenkins.get();\n        String origin = SCMEvent.originOf(request);\n        for (Listener listener : jenkins.getExtensionList(Listener.class)) {\n            contributors.addAll(listener.onNotifyCommit(origin, uri, sha1, buildParameters, branchesArray));\n        }\n\n        return (StaplerRequest req, StaplerResponse rsp, Object node) -> {\n            rsp.setStatus(SC_OK);\n            rsp.setContentType(\"text/plain\");\n            for (int i = 0; i < contributors.size(); i++) {\n                if (i == MAX_REPORTED_CONTRIBUTORS) {\n                    rsp.addHeader(\"Triggered\", \"<\" + (contributors.size() - i) + \" more>\");\n                    break;\n                } else {\n                    contributors.get(i).addHeaders(req, rsp);\n                }\n            }\n            PrintWriter w = rsp.getWriter();\n            for (ResponseContributor c : contributors) {\n                c.writeBody(req, rsp, w);\n            }\n        };\n    }"
