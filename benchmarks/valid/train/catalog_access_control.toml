post_fix = "    public void doDeployText(StaplerRequest req, StaplerResponse rsp) throws IOException {\n        owner.getParent().checkPermission(DEPLOY);\n        rsp.setContentType(\"text/plain;charset=UTF-8\");\n        // Prevent jelly from flushing stream so Content-Length header can be added afterwards\n        FlushProofOutputStream out = new FlushProofOutputStream(rsp.getCompressedOutputStream(req));\n        try {\n            getLogText().writeLogTo(0, out);\n        } catch (IOException e) {\n            // see comment in writeLogTo() method\n            InputStream input = getLogInputStream();\n            try {\n                IOUtils.copy(input, out);\n            } finally {\n                IOUtils.closeQuietly(input);\n            }\n        }\n        out.close();\n    }\n\n    /**\n     * Returns an input stream that reads from the log file.\n     * It will use a gzip-compressed log file (log.gz) if that exists.\n     *\n     * @return an input stream from the log file, or null if none exists\n     */"
