post_fix = "        protected FormValidation doTestConnection(URL ec2endpoint, boolean useInstanceProfileForCredentials, String credentialsId, String privateKey, String roleArn, String roleSessionName, String region)\n                throws IOException, ServletException {\n            Jenkins.get().checkPermission(Jenkins.ADMINISTER);\n            try {\n                AWSCredentialsProvider credentialsProvider = createCredentialsProvider(useInstanceProfileForCredentials, credentialsId, roleArn, roleSessionName, region);\n                AmazonEC2 ec2 = AmazonEC2Factory.getInstance().connect(credentialsProvider, ec2endpoint);\n                ec2.describeInstances();\n\n                if (privateKey == null)\n                    return FormValidation.error(\"Private key is not specified. Click 'Generate Key' to generate one.\");\n\n                if (privateKey.trim().length() > 0) {\n                    // check if this key exists\n                    EC2PrivateKey pk = new EC2PrivateKey(privateKey);\n                    if (pk.find(ec2) == null)\n                        return FormValidation\n                                .error(\"The EC2 key pair private key isn't registered to this EC2 region (fingerprint is \"\n                                        + pk.getFingerprint() + \")\");\n                }\n\n                return FormValidation.ok(Messages.EC2Cloud_Success());\n            } catch (AmazonClientException e) {\n                LOGGER.log(Level.WARNING, \"Failed to check EC2 credential\", e);\n                return FormValidation.error(e.getMessage());\n            }\n        }\n"
pre_fix = "        protected FormValidation doTestConnection(URL ec2endpoint, boolean useInstanceProfileForCredentials, String credentialsId, String privateKey, String roleArn, String roleSessionName, String region)\n                throws IOException, ServletException {\n            try {\n                AWSCredentialsProvider credentialsProvider = createCredentialsProvider(useInstanceProfileForCredentials, credentialsId, roleArn, roleSessionName, region);\n                AmazonEC2 ec2 = AmazonEC2Factory.getInstance().connect(credentialsProvider, ec2endpoint);\n                ec2.describeInstances();\n\n                if (privateKey == null)\n                    return FormValidation.error(\"Private key is not specified. Click 'Generate Key' to generate one.\");\n\n                if (privateKey.trim().length() > 0) {\n                    // check if this key exists\n                    EC2PrivateKey pk = new EC2PrivateKey(privateKey);\n                    if (pk.find(ec2) == null)\n                        return FormValidation\n                                .error(\"The EC2 key pair private key isn't registered to this EC2 region (fingerprint is \"\n                                        + pk.getFingerprint() + \")\");\n                }\n\n                return FormValidation.ok(Messages.EC2Cloud_Success());\n            } catch (AmazonClientException e) {\n                LOGGER.log(Level.WARNING, \"Failed to check EC2 credential\", e);\n                return FormValidation.error(e.getMessage());\n            }\n        }\n"
