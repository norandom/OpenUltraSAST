# No repository was cloned, no scanner or project tooling run on any of them, and none is referenced anywhere in
# this project's development tree (checked against every github.com URL under benchmarks/, src/, tests/ and
# .kiro/, which includes populations v1 and v2).
#
# Why a v3: the PHP quick-mode rules were written on 2026-09-30 while looking at PMPro, population-v1's PHP cases,
# Ultimate Member, MediaWiki and WP Statistics, so no PHP number measured so far qualifies them, and population v2
# is reserved for other qualification. v3 is PHP cases nobody in this project has looked at.
#
# HOLD-OUT RULES (v1's and v2's): no scanner, quick rule, engine, plane task or model is run on any of these
# repositories, and no trace, probe or census of them is made, before the population is FROZEN and protocol-v3.md
# is committed. Freezing reads git history, file lists and the fix commit's diff only. No rule, fact, query,
# prompt or scoring change may cite these cases before their evaluation is recorded; any analyzer change made
# after a v3 result is a retune that v3 cannot qualify. tests/test_independent_population.py fails the moment one
# of these repositories is named anywhere under benchmarks/, src/ or tests/ outside this directory.
#
# SELECTION RULE (research-2026-09-30-php.md, "Recommended balanced selection"), applied mechanically: family
# targets injection 5, output_encoding 3, path 3, untrusted_destination 2, access_control 2, deserialization 1;
# within a family, candidates whose fix commit the advisory names come first, then newest first by publication;
# take the first n.
#
# Maintainer's decision 2026-09-30, "Recommended 16, minus v2 mentions": the advisories that
# research-2026-09-26.md (population v2's research) names in its passed-over note are excluded, and each slot
# they held goes to the next candidate in its family by the same rule. Excluded as v2 mentions: Winter, elFinder,
# Easy!Appointments (all three in the recommended 16), and Grav, Backpack CRUD and Koel (alternates).
#   - injection: winter-filter-numberrange-sqli -> mantisbt-tokenizer-eval-rce (next named fix, 2026-07-15).
#   - untrusted_destination: elfinder-fsock-dns-rebinding-ssrf -> pagible-admin-proxy-dns-rebinding-ssrf (koel,
#     next in line, is a v2 mention; pagible's fix is inferred). easyappointments-caldav-ssrf -> EMPTY: the family
#     has no remaining candidate among the 26 (the research's further alternates were never verified and hold no
#     record), so the slot is left empty rather than bending the rule. The population holds 15 cases.
#
# `sites` are the sink or execution locations the ADVISORY names (`path::function`, `<global>` for file scope),
# declared before any scan. Where an advisory names only a file (`site_files`), the function is resolved at
# freeze from the fix commit's diff of that file (maintainer's decision 2, "Resolve the function at freeze"), and
# the freeze record gives each site's basis. Protocol v3 credits a finding at a declared site as well as one
# matching the fix's changed lines.
#
# Fixes the advisory does not name (`fix_named_by_advisory = false`) are confirmed at freeze: the diff must change
# the declared sink file and function, or the case is dropped and the next candidate taken by the rule.
#
# Licences marked "verify" must be checked before any result is published. Kirby is under a proprietary licence:
# it stays in the population, but its results are unpublishable without the licensor's permission.

