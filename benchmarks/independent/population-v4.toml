# Independent evaluation population v4 (PHP, TypeScript, Python). Reserved 2026-11-23.
#
# RESERVED, NOT SCANNED. Chosen by web research alone (research-2026-11-23.md, the research record; no candidates
# file is written for v4): sixteen candidates read through advisories, commit metadata and fix diffs on the web, never
# by how easy a case looks for this analyzer, from which the maintainer selected twelve on 2026-11-23. No repository
# was cloned, no scanner or project tooling run on any of them, and none is referenced anywhere in this project's
# development tree: the research checked it with `git grep` for each OWNER/REPO, bare and as a github.com URL, and the
# same fixed-string search over benchmarks/, src/, tests/ and plane/ at reservation finds the twelve only in this
# file and the research record.
#
# Why a v4: v1 and v2 are spent and v3-php is frozen, unspent, PHP only and held for the one-time final check, so
# milestone M4's new untouched population is a fourth one. Like v1 and v2 it is mixed (four PHP, four TypeScript,
# three Python cases after the freeze dropped one) and holds multi-language repositories, PHP with its
# JavaScript (`multi_language_members`), which task 13.4 found is where a second language costs a question its
# completion. `language` is the research record's primary language as freeze.py spells it (php, typescript, python);
# `also` is the other language its languages column reports, for PHP and non-PHP cases alike (the v1 and v2 convention).
#
# HOLD-OUT RULES (v1's, v2's and v3's): no scanner, quick rule, engine, plane task or model runs on any of these
# repositories, and no trace, probe or census of them is made, before the population is FROZEN and the freeze commit
# is recorded. The freeze step reads no more than this of them: git history, file lists, the sink source at the
# vulnerable pin, the fix and benign diffs, the neighbouring source files at the vulnerable pin (those the research
# record or the fix diff names, those the code calls into, and those a plain text search for the sink function's
# callers or for the interpolated value finds in the directory beside it), licence files and commit metadata; nothing
# else is read before the freeze commit is recorded.
# No rule, fact, query, prompt or scoring change may cite these cases before their evaluation is recorded; any
# analyzer change made after a v4 result is a retune that v4 cannot qualify.
# The guard (tests/test_independent_population.py) reads every file under benchmarks/, plane/, src/ and tests/; this
# directory has not been exempt since commit 731eb8d. It fails the moment one of these repositories is named as
# github.com/OWNER/REPO outside the reservation's own files. The research record names them, so its exact SHA-256 is
# pinned in benchmarks/valid/reservation_guard_sources.py: from now on any byte change to it fails the guard too.
# The freeze record freeze-v4.json is pinned by SHA-256 the same way: a re-run of freeze.py would overwrite it, and
# the guard would then fail on the pin, so the record is not to be regenerated.
#
# SELECTION: the maintainer's, 2026-11-23, from the sixteen-candidate menu (research-2026-11-23.md, "Maintainer
# selection"). The core nine: #1 rtMedia, #2 Drupal core, #3 Known, #7 tianji, #10 Strapi, #13 agenticSeek, #14 Rucio,
# #15 LlamaFactory, #16 IRRD. Padding, because the guard test requires at least ten cases in every population and the
# freeze step may drop a case: #8 Vendure, #9 Novu, #5 TYPO3 news. Not selected: #4 Moodle, #6 Admidio,
# #11 terriajs-server, #12 Postiz. The menu records no selection criteria fixed before its advisories were read.
# Family ids are the guard test's: SQL injection -> injection; SSRF and the host-header reset-link poisoning ->
# untrusted_destination; default CORS and Flask debug mode -> config_secrets.
#
# `sites` are the sink locations the research record names (`path::function`; `<global>` for file scope), declared
# before any scan; the first names the sink file. A declared site is never a fix-side guard location (controller
# decision, 2026-11-23); such a location is described in `notes` or `caveats` only, as for Drupal core. `site_basis`
# says how each was named: `research-named` here, and `resolved-from-fix-diff` where the freeze resolves a `site_files`
# entry (a file the research record names without a function) from the fix commit's diff of that file.
# `freeze-review-named` marks a function the freeze hand review named by hand in a Python or TypeScript file, where
# freeze.py finds no function. At reservation freeze.py finds functions in PHP files only, so a TypeScript or Python
# `site_files` entry resolves to `<module>` there and must be named by hand from the sink source at the vulnerable pin.
# `sink_evidence` is a short literal from the research record's quotation of the sink file that must appear in that file
# at the vulnerable pin; it is declared where the sink is file scope, where no function is named, or where the function
# name is too common to be searched as text.
#
# The research record does not say, for any of the twelve, whether the advisory names the fix commit, so
# `fix_named_by_advisory` is not declared here; it stayed undeclared at the freeze (see FROZEN). If it is set to
# `false`, mind that freeze.py's inferred-fix check then looks only at sites labelled `advisory-named`, of which there
# are none. A second limit: freeze.py's `fix_changes_sites` (lines 200-211) resolves functions in PHP files only, so for
# the seven TypeScript and Python cases the inferred-fix check can never confirm a fix even after relabelling; that
# confirmation is then a manual step of the freeze hand review, and the controller names Vendure and Rucio for it.
# `published` is the date the research record gives with the advisory ids, or says that it gives none. `ancestry`
# carries the tags and backports the research record states with full SHAs; abbreviated ones stay there.
#
# Licences the research could not read were read in the freeze hand review and replace the reserved values: rtMedia
# (GPL-2.0-or-later, stated in the plugin headers only: the tree at the fixed pin has no licence file), Vendure
# (GPL-3.0-or-later) and Novu (MIT outside the enterprise directories) and Strapi (MIT outside `ee/`). One licence the
# research did read is corrected by the review: typo3-news-datemenu-sqli, `GPL-2.0` -> `GPL-2.0-or-later` per
# composer.json line 4 (review part a). The licence qualifications the reviews give are kept in the cases' `notes`.
# Not checked against a licence list: whether agenticSeek's GPL-3.0 should be GPL-3.0-only.
#
# No `benign` pair is declared at reservation: the freeze adds it. The research record proposes one for several
# cases, to be reviewed at freeze time.
#
# FROZEN 2026-11-23 (freeze.py, freeze-v4.json). What was read of the repositories, by freeze.py and by the hand
# review, and nothing else: git history, file lists, the sink source at the vulnerable pin, the fix and benign diffs,
# the neighbouring source files at the vulnerable pin (those the research record or the fix diff names, those the code
# calls into, and those a plain text search for the sink function's callers or for the interpolated value finds in the
# directory beside it; read to tell a fix-side guard from a flaw location and to find the link-building function),
# licence files and commit metadata. No scanner, rule, engine, trace, probe or census ran. Verified for every
# case by freeze.py and re-read in the hand review: both pins are commits; the vulnerable pin is an ancestor of the
# fixed pin (its parent in all twelve); the sink file exists at both pins and its SHA-256 at each is in the freeze
# record; the fix touches the sink file; the sink file was read at the vulnerable pin, and for the eleven kept cases
# the quoted sink lines and function are the record's `sink_review`; each `sink_evidence` literal is in the sink file
# at the vulnerable pin. Each benign diff was read in the review: ten freeze.py proposals were accepted and one
# (agenticSeek) was replaced by hand, with the reason in the record's `benign_review`. `sites` are the reviews' final
# sites, each a sink or flaw location and never a fix-side guard; every `site_files` entry the fix changes is resolved,
# so no `site_files_unresolved` remains. Dropped at the freeze: irrd-host-header-reset-poisoning, because its declared
# sink file irrd/webui/auth/users.py holds no link construction at the vulnerable pin and the fix touches none of the
# files that build the reset link (it adds TrustedHostMiddleware in irrd/server/http/app.py), so the sink is not
# confirmed and re-pointing the site could not make the fix touch it; its record stays in freeze-v4.json. The
# population holds eleven cases: four PHP, four TypeScript, three Python; families injection 6, untrusted_destination
# 3, config_secrets 2. The review is two hand-review files, one object per case (part a: the first six cases of this
# file's order; part b: the last six), each holding the sink quote, lines and function, the final sites, the fix note,
# the benign verdict and reason, a replacement where the proposal was rejected, the licence and the drop decision.
# `fix_named_by_advisory` stays undeclared: each fix was confirmed in the review from its diff against the advisory.

