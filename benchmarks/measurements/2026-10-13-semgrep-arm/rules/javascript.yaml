    family: output_encoding
    cwe: CWE-79
    origin: sink:javascript:html.unescaped
    precision_estimate: unmeasured
    kind: taint
    calls:
    - dangerouslySetInnerHTML
    - document.write
    - innerHTML
    - insertAdjacentHTML
    - outerHTML
    - v-html
  pattern-sources:
  - pattern-either: *id002
  pattern-sinks:
  - pattern-either:
    - patterns:
      - pattern: '{__html: $VALUE}'
      - focus-metavariable: $VALUE
