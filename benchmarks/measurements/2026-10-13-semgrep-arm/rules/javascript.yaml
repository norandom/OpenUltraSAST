rules:
- id: ousast.javascript.regex.js-command-exec
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Node child_process command execution needs review
  metadata:
    family: injection
    cwe: CWE-78
    origin: js-command-exec
    precision_estimate: '0.0'
    kind: regex
    tags:
    - syscall_entry
    status: enabled
    version: '1'
  pattern-regex: \b(exec|execSync)\s*\(
- id: ousast.javascript.regex.js-deserialize
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: JavaScript unsafe deserialization needs review
  metadata:
    family: deserialization
    cwe: CWE-502
    origin: js-deserialize
    precision_estimate: '0.0'
    kind: regex
    tags:
    - deserialization
    status: enabled
    version: '1'
  pattern-regex: \b(unserialize)\s*\(
- id: ousast.javascript.regex.js-dom-xss
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: DOM sink with untrusted input needs review
  metadata:
    family: output_encoding
    cwe: CWE-79
    origin: js-dom-xss
    precision_estimate: '0.0'
    kind: regex
    tags:
    - injection
    status: enabled
    version: '1'
  pattern-regex: \.(innerHTML|outerHTML)\s*=\s*[^\n]*\b(?:req|request|location|document\.location)
- id: ousast.javascript.regex.js-eval
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Dynamic JavaScript evaluation needs review
  metadata:
    family: injection
    cwe: CWE-95
    origin: js-eval
    precision_estimate: '0.0'
    kind: regex
    tags:
    - syscall_entry
    status: enabled
    version: '1'
  pattern-regex: \b(eval)\s*\(
- id: ousast.javascript.regex.js-function-constructor
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: JavaScript Function constructor needs review
  metadata:
    family: injection
    cwe: CWE-95
    origin: js-function-constructor
    precision_estimate: '0.0'
    kind: regex
    tags:
    - syscall_entry
    status: enabled
    version: '1'
  pattern-regex: new\s+(Function)\s*\(
- id: ousast.javascript.regex.js-path-traversal
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Node filesystem access with external input needs review
  metadata:
    family: path
    cwe: CWE-22
    origin: js-path-traversal
    precision_estimate: '0.0'
    kind: regex
    tags:
    - filesystem_entry
    status: enabled
    version: '1'
  pattern-regex: \bfs\.(readFile|readFileSync|writeFile|writeFileSync|createReadStream|unlink|unlinkSync)\s*\(\s*[^\n]*\b(?:req|request)\.
- id: ousast.javascript.regex.js-spawn-shell
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Node spawn with shell needs review
  metadata:
    family: injection
    cwe: CWE-78
    origin: js-spawn-shell
    precision_estimate: '0.0'
    kind: regex
    tags:
    - syscall_entry
    status: enabled
    version: '1'
  pattern-regex: \b(spawn|spawnSync)\s*\([^\n]*shell\s*:\s*true
- id: ousast.javascript.regex.js-sql-injection
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: JavaScript SQL string composition needs review
  metadata:
    family: injection
    cwe: CWE-89
    origin: js-sql-injection
    precision_estimate: '0.0'
    kind: regex
    tags:
    - injection
    status: enabled
    version: '1'
  pattern-regex: \.(query|execute)\s*\(\s*[^\n]*(?:\$\{|\+\s*[A-Za-z_$])
- id: ousast.javascript.regex.js-ssrf
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: JavaScript outbound request with external input needs review
  metadata:
    family: untrusted_destination
    cwe: CWE-918
    origin: js-ssrf
    precision_estimate: '0.0'
    kind: regex
    tags:
    - network_entry
    status: enabled
    version: '1'
  pattern-regex: \b(axios|fetch|got)\s*[.(][^\n]*\b(?:req|request)\.
- id: ousast.javascript.regex.js-weak-hash
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: JavaScript weak hash needs review
  metadata:
    family: config_secrets
    cwe: CWE-327
    origin: js-weak-hash
    precision_estimate: '0.0'
    kind: regex
    tags:
    - crypto
    status: enabled
    version: '1'
  pattern-regex: createHash\s*\(\s*[\"'](md5|sha1)[\"']
- id: ousast.javascript.regex.js-xss-response
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Unsanitized HTTP response reflection needs review
  metadata:
    family: output_encoding
    cwe: CWE-79
    origin: js-xss-response
    precision_estimate: '0.0'
    kind: regex
    tags:
    - injection
    status: enabled
    version: '1'
  pattern-regex: \.(send|write|end)\s*\(\s*[^\n]*\b(?:req|request)\.(?:query|params|body)
- id: ousast.javascript.taint.eval
  mode: taint
  languages: &id001
  - javascript
  - typescript
  severity: ERROR
  message: 'eval: untrusted input reaches eval'
  metadata:
    family: injection
    cwe: CWE-95
    origin: sink:javascript:eval
    precision_estimate: unmeasured
    kind: taint
    calls:
    - eval
  pattern-sources:
  - pattern-either: &id002
    - pattern: req.query
    - pattern: req.query(...)
    - pattern: req.body
    - pattern: req.body(...)
    - pattern: req.params
    - pattern: req.params(...)
    - pattern: req.cookies
    - pattern: req.cookies(...)
    - pattern: req.headers
    - pattern: req.headers(...)
    - pattern: request.query
    - pattern: request.query(...)
    - pattern: req.url
    - pattern: req.url(...)
    - pattern: request.url
    - pattern: request.url(...)
    - pattern: req.rawHeaders
    - pattern: req.rawHeaders(...)
    - pattern: url.parse
    - pattern: url.parse(...)
    - pattern: parsedUrl
    - pattern: $OBJ.parsedUrl
    - pattern: parsedUrl(...)
    - pattern: $OBJ.parsedUrl(...)
  pattern-sinks:
  - pattern-either:
    - pattern: eval(...)
    - pattern: $OBJ.eval(...)
  pattern-sanitizers:
  - pattern-either:
    - &id003
      pattern: path.normalize(...)
    - &id004
      pattern: path.resolve(...)
    - &id005
      pattern: encodeURIComponent(...)
    - &id006
      pattern: $OBJ.encodeURIComponent(...)
    - &id007
      pattern: encodeURI(...)
    - &id008
      pattern: $OBJ.encodeURI(...)
    - &id009
      pattern: escape(...)
    - &id010
      pattern: $OBJ.escape(...)
    - &id011
      pattern: escapeHtml(...)
    - &id012
      pattern: $OBJ.escapeHtml(...)
    - &id013
      pattern: sanitizeHtml(...)
    - &id014
      pattern: $OBJ.sanitizeHtml(...)
    - &id015
      pattern: DOMPurify.sanitize(...)
