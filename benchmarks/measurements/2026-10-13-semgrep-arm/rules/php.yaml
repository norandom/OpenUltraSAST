rules:
- id: ousast.php.regex.php-wpdb-sql-composition
  languages:
  - php
  severity: WARNING
  message: WordPress $wpdb query composed from a variable without $wpdb->prepare
  metadata:
    family: injection
    cwe: CWE-89
    origin: php-wpdb-sql-composition
    precision_estimate: '0.032'
    kind: regex
    tags:
    - injection
    status: enabled
    version: '1'
  pattern-regex: \$wpdb->(get_var|get_results|get_row|get_col|query|replace)\s*\(\s*(?!\$wpdb->prepare)(?:"[^"\n]*\{?\$(?!wpdb->)[A-Za-z_]|[^\n;]*?["']\s*\.\s*\$(?!wpdb->)[A-Za-z_]|[^\n;]*?\$_(?:GET|POST|REQUEST|COOKIE)\b)
- id: ousast.php.regex.php-sql-unquoted-concat
  languages:
  - php
  severity: WARNING
  message: PHP SQL literal concatenates a variable into an unquoted position
  metadata:
    family: injection
    cwe: CWE-89
    origin: php-sql-unquoted-concat
    precision_estimate: '0.034'
    kind: regex
    tags:
    - injection
    status: enabled
    version: '1'
  pattern-regex: (?<![$\w>])(?=(VALUES|IN|ORDER|GROUP|LIMIT|OFFSET|WHERE|AND|OR|SET|HAVING)\b)(?:(?:VALUES|IN)\s*\(|(?:ORDER|GROUP)\s+BY\b[^"'\n]*|(?:LIMIT|OFFSET)\s+(?:\d+\s*,\s*)?|(?:WHERE|AND|OR|SET|HAVING)\s+[\w.`]+\s*(?:=|<>|!=|<=|>=|<|>|LIKE)\s*)["']\s*\.\s*\$(?!wpdb->)(?!\w*(?:format|placeholder))[A-Za-z_]
- id: ousast.php.regex.php-sql-unquoted-interpolation
  languages:
  - php
  severity: WARNING
  message: PHP SQL string interpolates a variable into an unquoted position
  metadata:
    family: injection
    cwe: CWE-89
    origin: php-sql-unquoted-interpolation
    precision_estimate: '0.129'
    kind: regex
    tags:
    - injection
    status: enabled
    version: '1'
  pattern-regex: (?<![$\w>])(?=(VALUES|IN|ORDER|GROUP|LIMIT|OFFSET|WHERE|AND|OR|SET|HAVING)\b)(?:(?:VALUES|IN)\s*\(\s*|(?:ORDER|GROUP)\s+BY\b[^"'\n;]*?|(?:LIMIT|OFFSET)\s+(?:\d+\s*,\s*)?|(?:WHERE|AND|OR|SET|HAVING)\s+[\w.`]+\s*(?:=|<>|!=|<=|>=|<|>|LIKE)\s*)\{?\$(?!wpdb->)(?!\w*(?:format|placeholder))[A-Za-z_]
- id: ousast.php.regex.php-sql-sprintf-unescaped
  languages:
  - php
  severity: WARNING
  message: PHP sprintf-built SQL with an unescaped %s value
  metadata:
    family: injection
    cwe: CWE-89
    origin: php-sql-sprintf-unescaped
    precision_estimate: '0.109'
    kind: regex
    tags:
    - injection
    status: enabled
    version: '1'
  pattern-regex: (sprintf)\(\s*["']\s*(?:SELECT|INSERT|UPDATE|DELETE|REPLACE)\b(?=(?:(?!\);)[\s\S])*?'%s')(?=(?:(?![Ee]scape|quote\(|intval\(|absint\(|\(int\)|esc_sql\()[\s\S])*?\);)
- id: ousast.php.regex.php-command-injection
  languages:
  - php
  severity: WARNING
  message: PHP shell command built from a variable without escapeshellarg
  metadata:
    family: injection
    cwe: CWE-78
    origin: php-command-injection
    precision_estimate: '1.0'
    kind: regex
    tags:
    - syscall_entry
    status: enabled
    version: '1'
  pattern-regex: (?<![\w>:$\\])(?<!function )(system|exec|shell_exec|passthru|popen|proc_open|pcntl_exec)\s*\((?![^\n]*escapeshell(?:arg|cmd)\s*\()[^,\n;]*\$[A-Za-z_]
- id: ousast.php.regex.php-file-inclusion-input
  languages:
  - php
  severity: WARNING
  message: PHP include/require of a path from request input
  metadata:
    family: path
    cwe: CWE-98
    origin: php-file-inclusion-input
    precision_estimate: '0.5'
    kind: regex
    tags:
    - filesystem_entry
    status: enabled
    version: '1'
  pattern-regex: (?m)^(?![^\n]*\b(?:basename|realpath)\s*\()[^\n]*?(?<![\w'"$>:-])(include|include_once|require|require_once)\b(?!['"\]])\s*\(?[^\n;]*\$_(?:GET|POST|REQUEST|COOKIE)\b
- id: ousast.php.regex.php-path-input
  languages:
  - php
  severity: WARNING
  message: PHP filesystem call on a path from request input
  metadata:
    family: path
    cwe: CWE-22
    origin: php-path-input
    precision_estimate: '1.0'
    kind: regex
    tags:
    - filesystem_entry
    status: enabled
    version: '1'
  pattern-regex: (?m)^(?![^\n]*\b(?:basename|realpath)\s*\()[^\n]*?(?<![\w>:$\\])(fopen|file_get_contents|file_put_contents|readfile|unlink|copy|rename|scandir|opendir|mkdir|rmdir|move_uploaded_file)\s*\([^\n;]*\$_(?:GET|POST|REQUEST|COOKIE)\b
- id: ousast.php.regex.php-ssrf-input
  languages:
  - php
  severity: WARNING
  message: PHP outbound request to a URL from request input
  metadata:
    family: untrusted_destination
    cwe: CWE-918
    origin: php-ssrf-input
    precision_estimate: '1.0'
    kind: regex
    tags:
    - network_entry
    status: enabled
    version: '1'
  pattern-regex: (?<![\w>:$\\])(curl_init|curl_setopt|fsockopen|stream_socket_client|get_headers)\s*\([^\n;]*\$_(?:GET|POST|REQUEST|COOKIE)\b
- id: ousast.php.regex.php-open-redirect
  languages:
  - php
  severity: WARNING
  message: PHP Location header from request input
  metadata:
    family: untrusted_destination
    cwe: CWE-601
    origin: php-open-redirect
    precision_estimate: '1.0'
    kind: regex
    tags:
    - injection
    status: enabled
    version: '1'
  pattern-regex: (?<![\w>:$\\])(header)\s*\(\s*["']Location:[^\n;]*(?:\$_(?:GET|POST|REQUEST|COOKIE)\b|HTTP_REFERER)
- id: ousast.php.taint.code_eval
  mode: taint
  languages: &id001
  - php
  severity: ERROR
  message: 'code_eval: untrusted input reaches assert, create_function, eval'
  metadata:
    family: injection
    cwe: CWE-95
    origin: sink:php:code_eval
    precision_estimate: unmeasured
    kind: taint
    calls:
    - assert
    - create_function
    - eval
  pattern-sources:
  - pattern-either: &id002
    - pattern: $_GET
    - pattern: $_GET[...]
    - pattern: $_POST
    - pattern: $_POST[...]
    - pattern: $_REQUEST
    - pattern: $_REQUEST[...]
    - pattern: $_COOKIE
    - pattern: $_COOKIE[...]
    - pattern: $_FILES
    - pattern: $_FILES[...]
    - pattern: $_SERVER
    - pattern: $_SERVER[...]
    - pattern: file_get_contents("php://input")
  pattern-sinks:
  - pattern-either:
    - pattern: assert(...)
    - pattern: create_function(...)
    - pattern: eval(...)
  pattern-sanitizers:
  - pattern-either:
    - &id003
      pattern: htmlspecialchars(...)
    - &id004
      pattern: htmlentities(...)
    - &id005
      pattern: html_entity_decode_safe(...)
    - &id006
      pattern: mysqli_real_escape_string(...)
    - &id007
      pattern: mysql_real_escape_string(...)
    - &id008
      pattern: pg_escape_string(...)
    - &id009
      pattern: esc_sql(...)
    - &id010
      pattern: pg_escape_literal(...)
    - &id011
      pattern: $wpdb->prepare(...)
    - &id012
      pattern: escapeshellarg(...)
    - &id013
      pattern: escapeshellcmd(...)
    - &id014
      pattern: basename(...)
    - &id015
      pattern: realpath(...)
    - &id016
      pattern: intval(...)
    - &id017
      pattern: floatval(...)
    - &id018
      pattern: filter_var(...)
    - &id019
      pattern: settype(...)
    - &id020
      pattern: absint(...)
