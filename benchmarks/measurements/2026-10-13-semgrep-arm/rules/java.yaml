  pattern-sinks:
  - pattern-either:
    - pattern: exec(...)
    - pattern: $OBJ.exec(...)
  pattern-sanitizers:
  - pattern-either:
    - &id003
      pattern: getCanonicalPath(...)
    - &id004
      pattern: $OBJ.getCanonicalPath(...)
    - &id005
      pattern: normalize(...)
    - &id006
      pattern: $OBJ.normalize(...)
    - &id007
      pattern: URLEncoder.encode(...)
    - &id008
      pattern: ESAPI.encoder(...)
    - &id009
      pattern: encodeForHTML(...)
    - &id010
      pattern: $OBJ.encodeForHTML(...)
    - &id011
      pattern: encodeForURL(...)
    - &id012
      pattern: $OBJ.encodeForURL(...)
    - &id013
      pattern: StringEscapeUtils.escapeHtml4(...)
