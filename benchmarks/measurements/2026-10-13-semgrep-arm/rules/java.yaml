    - pattern: getParameter
    - pattern: $OBJ.getParameter
    - pattern: getParameter(...)
    - pattern: $OBJ.getParameter(...)
    - pattern: getHeader
    - pattern: $OBJ.getHeader
    - pattern: getHeader(...)
    - pattern: $OBJ.getHeader(...)
    - pattern: getCookies
