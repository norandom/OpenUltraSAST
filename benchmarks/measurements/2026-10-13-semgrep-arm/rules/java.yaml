rules:
- id: ousast.java.regex.java-command-exec
  languages:
  - java
  severity: WARNING
  message: Java runtime command execution needs review
  metadata:
    family: injection
    cwe: CWE-78
    origin: java-command-exec
    precision_estimate: '0.0'
    kind: regex
    tags:
    - syscall_entry
    status: enabled
    version: '1'
  pattern-regex: \b(exec)\s*\(
- id: ousast.java.regex.java-deserialization
  languages:
  - java
  severity: WARNING
  message: Java unsafe deserialization needs review
  metadata:
    family: deserialization
    cwe: CWE-502
    origin: java-deserialization
    precision_estimate: '0.0'
    kind: regex
    tags:
    - deserialization
    status: enabled
    version: '1'
  pattern-regex: \.(readObject)\s*\(
- id: ousast.java.regex.java-sql-injection
  languages:
  - java
  severity: WARNING
  message: Java SQL string composition needs review
  metadata:
    family: injection
    cwe: CWE-89
    origin: java-sql-injection
    precision_estimate: '0.0'
    kind: regex
    tags:
    - injection
    status: enabled
    version: '1'
  pattern-regex: (?i)\"\s*(select|insert|update|delete)\b[^\"]*\"\s*\+
- id: ousast.java.regex.java-weak-hash
  languages:
  - java
  severity: WARNING
  message: Java weak hash needs review
  metadata:
    family: config_secrets
    cwe: CWE-327
    origin: java-weak-hash
    precision_estimate: '0.0'
    kind: regex
    tags:
    - crypto
    status: enabled
    version: '1'
  pattern-regex: MessageDigest\.getInstance\s*\(\s*\"(MD5|SHA-1)\"
- id: ousast.java.weak.MessageDigest
  languages: &id001
  - java
  severity: WARNING
  message: 'MessageDigest: a weak literal reaches getInstance'
  metadata:
    family: config_secrets
    cwe: CWE-327
    origin: sink:java:MessageDigest
    precision_estimate: unmeasured
    kind: weak_literal
    weak_literals:
    - MD5
    - SHA-1
    - SHA1
  pattern-either:
  - patterns:
    - pattern: getInstance($ALGORITHM, ...)
    - metavariable-regex:
        metavariable: $ALGORITHM
        regex: ^["']?(MD5|SHA\-1|SHA1)["']?$
  - patterns:
    - pattern: $OBJ.getInstance($ALGORITHM, ...)
    - metavariable-regex:
        metavariable: $ALGORITHM
        regex: ^["']?(MD5|SHA\-1|SHA1)["']?$
- id: ousast.java.taint.exec
