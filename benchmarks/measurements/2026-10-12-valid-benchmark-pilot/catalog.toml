post_fix = "  writePage (lng, namespace, missings, callback) {\n    const missingUrl = interpolateUrl(this.options.addPath, {\n      lng,\n      ns: namespace,\n      projectId: this.options.projectId,\n      version: this.options.version\n    })\n    const updatesUrl = interpolateUrl(this.options.updatePath, {\n      lng,\n      ns: namespace,\n      projectId: this.options.projectId,\n      version: this.options.version\n    })\n    if (missingUrl == null || updatesUrl == null) {\n      // Drop the queued writes silently rather than POST to an attacker-crafted\n      // URL. Log-safe values only.\n      if (typeof callback === 'function') {\n        callback(new Error('i18next-locize-backend: unsafe lng/ns/projectId/version — refusing to persist missing keys for lng=' + sanitizeLogValue(String(lng)) + ' ns=' + sanitizeLogValue(String(namespace))))\n      }\n      return\n    }\n\n    let hasMissing = false\n    let hasUpdates = false\n    const payloadMissing = {}\n    const payloadUpdate = {}\n\n    missings.forEach(item => {\n      const value =\n        item.options && item.options.tDescription\n          ? {\n              value: item.fallbackValue || '',\n              context: { text: item.options.tDescription }\n            }\n          : item.fallbackValue || ''\n      if (item.options && item.options.isUpdate) {\n        if (!hasUpdates) hasUpdates = true\n        payloadUpdate[item.key] = value\n      } else {\n        if (!hasMissing) hasMissing = true\n        payloadMissing[item.key] = value\n      }\n    })\n\n    let todo = 0\n    if (hasMissing) todo++\n    if (hasUpdates) todo++"
pre_fix = "  writePage (lng, namespace, missings, callback) {\n    const missingUrl = interpolate(this.options.addPath, {\n      lng,\n      ns: namespace,\n      projectId: this.options.projectId,\n      version: this.options.version\n    })\n    const updatesUrl = interpolate(this.options.updatePath, {\n      lng,\n      ns: namespace,\n      projectId: this.options.projectId,\n      version: this.options.version\n    })\n\n    let hasMissing = false\n    let hasUpdates = false\n    const payloadMissing = {}\n    const payloadUpdate = {}\n\n    missings.forEach(item => {\n      const value =\n        item.options && item.options.tDescription\n          ? {\n              value: item.fallbackValue || '',\n              context: { text: item.options.tDescription }\n            }\n          : item.fallbackValue || ''\n      if (item.options && item.options.isUpdate) {\n        if (!hasUpdates) hasUpdates = true\n        payloadUpdate[item.key] = value\n      } else {\n        if (!hasMissing) hasMissing = true\n        payloadMissing[item.key] = value\n      }\n    })\n\n    let todo = 0\n    if (hasMissing) todo++\n    if (hasUpdates) todo++"
