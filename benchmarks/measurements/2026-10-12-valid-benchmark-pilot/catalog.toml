post_fix = "async function startServer(bundleStats, opts) {\n  const {\n    port = 8888,\n    host = '127.0.0.1',\n    openBrowser = true,\n    bundleDir = null,\n    logger = new Logger(),\n    defaultSizes = 'parsed',\n    excludeAssets = null\n  } = opts || {};\n\n  const analyzerOpts = {logger, excludeAssets};\n\n  let chartData = getChartData(analyzerOpts, bundleStats, bundleDir);\n\n  if (!chartData) return;\n\n  const app = express();\n\n  // Explicitly using our `ejs` dependency to render templates\n  // Fixes #17\n  app.engine('ejs', require('ejs').renderFile);\n  app.set('view engine', 'ejs');\n  app.set('views', `${projectRoot}/views`);\n  app.use(express.static(`${projectRoot}/public`));\n\n  app.use('/', (req, res) => {\n    res.render('viewer', {\n      mode: 'server',\n      get chartData() { return chartData },\n      defaultSizes,\n      enableWebSocket: true,\n      // Helpers\n      escapeJson\n    });\n  });\n\n  const server = http.createServer(app);\n\n  await new Promise(resolve => {\n    server.listen(port, host, () => {\n      resolve();\n\n      const url = `http://${host}:${server.address().port}`;\n\n      logger.info(\n        `${bold('Webpack Bundle Analyzer')} is started at ${bold(url)}\\n` +\n        `Use ${bold('Ctrl+C')} to close it`\n      );\n\n      if (openBrowser) {\n        opener(url);\n      }\n    });\n  });\n\n  const wss = new WebSocket.Server({server});\n\n  wss.on('connection', ws => {\n    ws.on('error', err => {\n      // Ignore network errors like `ECONNRESET`, `EPIPE`, etc.\n      if (err.errno) return;\n\n      logger.info(err.message);\n    });\n  });\n\n  return {\n    ws: wss,\n    http: server,\n    updateChartData\n  };\n"
pre_fix = "async function startServer(bundleStats, opts) {\n  const {\n    port = 8888,\n    host = '127.0.0.1',\n    openBrowser = true,\n    bundleDir = null,\n    logger = new Logger(),\n    defaultSizes = 'parsed',\n    excludeAssets = null\n  } = opts || {};\n\n  const analyzerOpts = {logger, excludeAssets};\n\n  let chartData = getChartData(analyzerOpts, bundleStats, bundleDir);\n\n  if (!chartData) return;\n\n  const app = express();\n\n  // Explicitly using our `ejs` dependency to render templates\n  // Fixes #17\n  app.engine('ejs', require('ejs').renderFile);\n  app.set('view engine', 'ejs');\n  app.set('views', `${projectRoot}/views`);\n  app.use(express.static(`${projectRoot}/public`));\n\n  app.use('/', (req, res) => {\n    res.render('viewer', {\n      mode: 'server',\n      get chartData() { return JSON.stringify(chartData) },\n      defaultSizes: JSON.stringify(defaultSizes),\n      enableWebSocket: true,\n      // Helpers\n      escapeScript\n    });\n  });\n\n  const server = http.createServer(app);\n\n  await new Promise(resolve => {\n    server.listen(port, host, () => {\n      resolve();\n\n      const url = `http://${host}:${server.address().port}`;\n\n      logger.info(\n        `${bold('Webpack Bundle Analyzer')} is started at ${bold(url)}\\n` +\n        `Use ${bold('Ctrl+C')} to close it`\n      );\n\n      if (openBrowser) {\n        opener(url);\n      }\n    });\n  });\n\n  const wss = new WebSocket.Server({server});\n\n  wss.on('connection', ws => {\n    ws.on('error', err => {\n      // Ignore network errors like `ECONNRESET`, `EPIPE`, etc.\n      if (err.errno) return;\n\n      logger.info(err.message);\n    });\n  });\n\n  return {\n    ws: wss,\n    http: server,\n    updateChartData\n  };\n"
