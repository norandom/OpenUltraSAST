post_fix = "function isSafeUrlSegmentBase (v) {\n  if (typeof v !== 'string') return false\n  if (v.length === 0 || v.length > 128) return false\n  if (UNSAFE_KEYS.indexOf(v) > -1) return false\n  if (v.indexOf('..') > -1) return false\n  if (v.indexOf('\\\\') > -1) return false\n  // Block characters that would terminate/restructure the URL:\n  // `?` (starts query), `#` (starts fragment), `%` (percent-encoded bypass\n  // of `..`/`/` via `%2E%2E`/`%2F`), space (ambiguous), `:` (scheme\n  // delimiter — when the template starts with the placeholder, e.g.\n  // `{{lng}}/{{ns}}.json`, a value like `http:127.0.0.1:8080` turns the\n  // whole URL absolute and redirects the request to another origin; see\n  // GHSA-xvq9-wjp8-hwqf). No language code and no usable i18next namespace\n  // (`:` is the default `nsSeparator`) contains a colon.\n  if (/[?#%:\\s]/.test(v)) return false\n  // eslint-disable-next-line no-control-regex\n  if (/[\\x00-\\x1F\\x7F]/.test(v)) return false\n  return true\n}\n\n// Strict — also rejects `/` and `@`. Applied to `lng`:\n// no legitimate BCP-47 / i18next language-code shape\n// (https://www.i18next.com/how-to/faq#how-should-the-language-codes-be-formatted)\n// contains `/` or `@` (`@` is the authority boundary in\n// userinfo-containing URLs), so allowing them would only enable attacks."
