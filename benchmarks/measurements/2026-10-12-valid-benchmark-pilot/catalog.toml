pre_fix = "async function startSSEServer(): Promise<void> {\n  const app = express();\n\n  if (MCP_TRUST_PROXY) {\n    app.set(\"trust proxy\", 1);\n  }\n\n  const transports: { [sessionId: string]: SSEServerTransport } = {};\n  let shuttingDown = false;\n\n  app.get(\"/sse\", async (_: Request, res: Response) => {\n    const serverInstance = createServer();\n    const transport = new SSEServerTransport(\"/messages\", res);\n    transports[transport.sessionId] = transport;\n    res.on(\"close\", () => {\n      delete transports[transport.sessionId];\n    });\n    await serverInstance.connect(transport);\n  });\n\n  app.post(\"/messages\", async (req: Request, res: Response) => {\n    const sessionId = req.query.sessionId as string;\n    const transport = transports[sessionId];\n    if (transport) {\n      await transport.handlePostMessage(req, res);\n    } else {\n      res.status(400).send(\"No transport found for sessionId\");\n    }\n  });\n\n  registerDownloadProxy(app);\n\n  app.get(\"/health\", (_: Request, res: Response) => {\n    res.status(200).json({\n      status: \"healthy\",\n      version: SERVER_VERSION,\n      transport: TransportMode.SSE,\n    });\n  });\n\n  const httpServer = app.listen(Number(PORT), HOST, () => {\n    logger.info(\"GitLab MCP Server running with SSE transport\");\n    logger.info(`${colorGreen}Endpoint: http://${HOST}:${PORT}/sse${colorReset}`);\n  });\n"
