advisory = "GHSA-pc6w-59fv-rh23"
advisory_text = "Langchain Community Vulnerable to XML External Entity (XXE) Attacks\n\nThe langchain-ai/langchain project, specifically the EverNoteLoader component, is vulnerable to XML External Entity (XXE) attacks due to insecure XML parsing. The vulnerability arises from the use of etree.iterparse() without disabling external entity references, which can lead to sensitive information disclosure. An attacker could exploit this by crafting a malicious XML payload that references local files, potentially exposing sensitive data such as /etc/passwd. This issue has been fixed in 0.3.27 of langchain-community."
commit = "e842452108089524e22c3a2ced851c021884556f"
cwe = "CWE-200"
family = "untrusted_destination"
function = "_parse_note_xml"
function_lines = [[131, 152]]
id = "langchain-ai-langchain-community-24110ebd7e55a43e"
language = "python"
method = "fix_site"
parent = "6057ba567d4339b48acbffb55f0885dcd05a0892"
path = "libs/community/langchain_community/document_loaders/evernote.py"
post_fix = "    def _parse_note_xml(xml_file: str) -> Iterator[Dict[str, Any]]:\n        \"\"\"Parse EverNote XML file securely.\n\n        Uses ``lxml`` with secure parsing configuration to prevent XML vulnerabilities\n        including XXE attacks, XML bombs, and malformed XML exploitation.\n\n        Args:\n            xml_file: Path to the EverNote export XML file.\n\n        Yields:\n            Dictionary containing parsed note data for each note in the file.\n\n        Raises:\n            ImportError: If ``lxml`` is not installed.\n        \"\"\"\n        try:\n            from lxml import etree\n        except ImportError as e:\n            logger.error(\n                \"Could not import `lxml`. Although it is not a required package to use \"\n                \"LangChain, using the EverNote loader requires `lxml`. Please install \"\n                \"`lxml` via `pip install lxml` and try again.\"\n            )\n            raise e\n\n        context = etree.iterparse(\n            xml_file,\n            encoding=\"utf-8\",\n            resolve_entities=False,  # Prevents XXE attacks\n            no_network=True,  # Blocks network-based external entities\n            recover=False,  # Avoid parsing invalid/malformed XML\n            huge_tree=False,  # Protect against XML Bomb DoS attacks\n        )\n\n        for action, elem in context:\n            if elem.tag == \"note\":\n                yield EverNoteLoader._parse_note(elem)"
pre_fix = "    def _parse_note_xml(xml_file: str) -> Iterator[Dict[str, Any]]:\n        \"\"\"Parse Evernote xml.\"\"\"\n        # Without huge_tree set to True, parser may complain about huge text node\n        # Try to recover, because there may be \"&nbsp;\", which will cause\n        # \"XMLSyntaxError: Entity 'nbsp' not defined\"\n        try:\n            from lxml import etree\n        except ImportError as e:\n            logger.error(\n                \"Could not import `lxml`. Although it is not a required package to use \"\n                \"Langchain, using the EverNote loader requires `lxml`. Please install \"\n                \"`lxml` via `pip install lxml` and try again.\"\n            )\n            raise e\n\n        context = etree.iterparse(\n            xml_file, encoding=\"utf-8\", strip_cdata=False, huge_tree=True, recover=True\n        )\n\n        for action, elem in context:\n            if elem.tag == \"note\":\n                yield EverNoteLoader._parse_note(elem)"
repo = "langchain-ai/langchain-community"
url = "https://github.com/langchain-ai/langchain-community.git"

