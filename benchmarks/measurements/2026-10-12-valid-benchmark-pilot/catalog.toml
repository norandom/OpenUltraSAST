post_fix = "export function hasXSS (input) {\n  if (typeof input !== 'string') return false\n\n  // Common XSS attack patterns\n  const xssPatterns = [\n    /<\\s*script.*?>/i,\n    /<\\s*\\/\\s*script\\s*>/i,\n    // event handlers on any tag position (not just first attribute)\n    /<\\s*\\w+\\s+[^>]*?\\bon\\w+\\s*=/i,\n    /javascript\\s*:/i,\n    /vbscript\\s*:/i,\n    /expression\\s*\\(/i,\n    /eval\\s*\\(/i,\n    /alert\\s*\\(/i,\n    /document\\.cookie/i,\n    /document\\.write\\s*\\(/i,\n    /window\\.location/i,\n    /innerHTML/i\n  ]\n\n  return xssPatterns.some((pattern) => pattern.test(input))\n}"
