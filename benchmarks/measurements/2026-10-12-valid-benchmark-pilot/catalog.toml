path = "i18nextLocizeBackend.js"
post_fix = "function defaults(obj) {\n  each.call(slice.call(arguments, 1), function (source) {\n    if (source) {\n      for (var _i = 0, _Object$keys = Object.keys(source); _i < _Object$keys.length; _i++) {\n        var prop = _Object$keys[_i];\n        if (UNSAFE_KEYS.indexOf(prop) > -1) continue;\n        if (obj[prop] === undefined) obj[prop] = source[prop];\n      }\n    }\n  });\n  return obj;\n}"
pre_fix = "function defaults(obj) {\n  each.call(slice.call(arguments, 1), function (source) {\n    if (source) {\n      for (var prop in source) {\n        if (obj[prop] === undefined) obj[prop] = source[prop];\n      }\n    }\n  });\n  return obj;\n}"
repo = "locize/i18next-locize-backend"
url = "https://github.com/locize/i18next-locize-backend.git"

