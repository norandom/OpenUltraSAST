post_fix = "def fulltext_query(query: str, group_ids: list[str] | None, driver: GraphDriver):\n    validate_group_ids(group_ids)\n\n    if driver.provider == GraphProvider.KUZU:\n        # Kuzu only supports simple queries.\n        if len(query.split(' ')) > MAX_QUERY_LENGTH:\n            return ''\n        return query\n    elif driver.provider == GraphProvider.FALKORDB:\n        return driver.build_fulltext_query(query, group_ids, MAX_QUERY_LENGTH)\n    group_ids_filter_list = (\n        [driver.fulltext_syntax + f'group_id:\"{g}\"' for g in group_ids]\n        if group_ids is not None\n        else []\n    )\n    group_ids_filter = ''\n    for f in group_ids_filter_list:\n        group_ids_filter += f if not group_ids_filter else f' OR {f}'\n\n    group_ids_filter += ' AND ' if group_ids_filter else ''\n\n    lucene_query = lucene_sanitize(query)\n    # If the lucene query is too long return no query\n    if len(lucene_query.split(' ')) + len(group_ids or '') >= MAX_QUERY_LENGTH:\n        return ''\n\n    full_query = group_ids_filter + '(' + lucene_query + ')'\n\n    return full_query\n\n"
pre_fix = "def fulltext_query(query: str, group_ids: list[str] | None, driver: GraphDriver):\n    if driver.provider == GraphProvider.KUZU:\n        # Kuzu only supports simple queries.\n        if len(query.split(' ')) > MAX_QUERY_LENGTH:\n            return ''\n        return query\n    elif driver.provider == GraphProvider.FALKORDB:\n        return driver.build_fulltext_query(query, group_ids, MAX_QUERY_LENGTH)\n    group_ids_filter_list = (\n        [driver.fulltext_syntax + f'group_id:\"{g}\"' for g in group_ids]\n        if group_ids is not None\n        else []\n    )\n    group_ids_filter = ''\n    for f in group_ids_filter_list:\n        group_ids_filter += f if not group_ids_filter else f' OR {f}'\n\n    group_ids_filter += ' AND ' if group_ids_filter else ''\n\n    lucene_query = lucene_sanitize(query)\n    # If the lucene query is too long return no query\n    if len(lucene_query.split(' ')) + len(group_ids or '') >= MAX_QUERY_LENGTH:\n        return ''\n\n    full_query = group_ids_filter + '(' + lucene_query + ')'\n\n    return full_query\n\n"
