# Advisory-fix pairs (2026-10-01): real fix commits for the families the pair corpus left without negatives.
#
# Every pair is a public fix commit for a published advisory (CVE / GHSA), distinct from its parent, and names the
# advisory's vulnerable function, which is declared on both sides and whose body the fix changes. The positive is the
# function at `parent`, the negative the same function at `commit`. Research and every rejected advisory:
# research-2026-10-01.md. Both sides are pointer pairs (vendored = false): materialize.py reads one file per side from
# a shallow blobless fetch into the pair cache and writes the function excerpts there; nothing upstream is vendored.
# verification.json is that script's per-pair check (declared on both sides, body changed, bytes read).
#
# Schema: the pair catalog's (benchmarks/pairs/README.md). `framework` is informational (the loader ignores it); the
# label family is the expected row's `family`. One pair per repository; `split` alternates train/holdout by fix date
# within each family, so a repository never straddles.

