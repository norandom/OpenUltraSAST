# OWASP BenchmarkJava slice — cross-site scripting (model-grounded-detection corpus expansion).
# slice = "owasp"
#
# WHAT THIS IS. Generated SAST-benchmark servlets, not real-world code. The slice measures BREADTH across a
# weakness class; it must never stand in for real-world performance, and its numbers belong in their own row.
# The corpus already shows a +16% overfitting gap between the development slice and the deciding real-world
# one, and a large synthetic slice blended into a headline would widen that invisibly.
#
# GROUND TRUTH is the suite's own expectedresults-1.2.csv, which states per test whether it is really
# vulnerable. A pair is a really-vulnerable test matched with the safe test of the SAME category it most
# resembles: adjacent tests come from one template, so the two differ in the sink or the sanitiser rather
# than being unrelated programs. Every pair here is >= 0.75 similar (median 0.91), against the 64% of the
# older `sast` OWASP entries that the group-4 stratification flagged as "different programs".
#
# WHY ONLY XSS. Seven categories were harvested and one representative of each was run through the model
# before vendoring. Only xss distinguished: its fix adds ESAPI encoding, which the Java sanitizer facts
# recognise. cmdi, sqli, ldapi and xpathi put the sink in a helper class outside the servlet and resolved no
# flow at all; pathtraver found the flow but its "safe" twin carries no distinguishing call, so text
# similarity had matched a twin that is not semantically the fix. Those 198 pairs are deliberately NOT
# vendored: adding pairs the model cannot read would inflate the corpus while making every number less
# interpretable.
#
# EVIDENCE for this slice is 3 of 3 pairs distinguished (model_entailed on the vulnerable side, dropping to
# model_corroborated on the fixed one). That is a small sample and is stated as such; the slice's own
# measurement is the real check.
#
# LICENCE: GPL-2.0, per BenchmarkJava's LICENSE file. The older `sast` entries declare GPL-3.0 for OWASP;
# that appears to be an error and is not copied here.

[[pair]]
name = "owasp-xss-benchmarktest00013"
slice = "owasp"
language = "java"
origin = "owasp-benchmark-java"
license = "GPL-2.0"
repo = "OWASP-Benchmark/BenchmarkJava"
cwe = "CWE-79"
vuln = "java/BenchmarkTest00013.java"
fixed = "java/BenchmarkTest00282.java"
relpath = "testcode/BenchmarkTest00013.java"
min_recall = 1.0
fix_policy = "silent"
provenance = "synthetic"
split = "holdout"
# template similarity to its safe twin, measured at harvest: 0.952

[[pair.expected]]
cwe = "CWE-79"
family = "output_encoding"
class = "cross-site scripting"
path = "testcode/BenchmarkTest00013.java"
function = "doPost"
evidence = "marked really-vulnerable in expectedresults-1.2.csv; the twin encodes with ESAPI"
mechanism = "container_taint"

