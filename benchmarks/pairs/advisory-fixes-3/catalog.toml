# Advisory-fix pairs, batch 3 (2026-10-04): more (vulnerable function, fixed function) pairs where the function
# SURVIVES the fix, to roughly double the decision engine's paired data.
#
# Same rules as batch 2 (benchmarks/pairs/advisory-fixes-2/catalog.toml): a reviewed GHSA advisory (pip, npm, maven,
# composer) whose single fix commit (one parent) is linked from the advisory -- or, new here, the single commit of a
# merged pull request the advisory links (its only commit, or its squash/rebase merge commit); at most 4 non-test source
# files and 120 changed source lines, or up to 6 files / 240 lines in a second pass (`fix_lines.source_total` records
# the size, and the function's diff was read either way); the function holding the changed code lines is declared
# exactly once on both sides (the label builder's matcher, learn.excerpt.function_bounds) and its body differs. The positive is that function at `parent`,
# the negative the same function at `commit`. The function is chosen by changed lines, then its diff was read and
# kept only when the named function itself holds the fix: `provenance = "agent"`, `fix_lines` records the counts.
# Advisories whose CWEs span two families (second pass) carry the family the function's diff shows (agent-chosen).
# Weighted toward the weak families (injection, untrusted_destination); enumeration reached back to 2023 for them,
# newest first, so `post_cutoff` (published on or after 2026-06-01) is recorded per pair.
# Repositories: permissive licences only (SPDX from the API), none named anywhere else under benchmarks/ (populations
# v1/v2, every pair corpus including batches 1 and 2), no WordPress plugin, and the reserved-population test passes.
#
# Pointer pairs (vendored = false), the advisory-fixes slice and cache layout: materialize.py --catalog <this file>
# verifies the cached excerpts (verification.json beside this file). Screening record:
# benchmarks/measurements/2026-10-04-decision-engine-harvest-3/record.json. `split` alternates train/holdout by fix
# date within each family; one pair per repository.

