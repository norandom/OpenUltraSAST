# Advisory-fix pairs, batch 2 (2026-10-03): fixed-side negatives where the function SURVIVES the fix.
#
# Why: the decision engine's memory had 98 positives-only repository groups (2026-10-02-decision-engine-negatives-gap),
# 94 of them vibe-py pairs whose fixed side lost the function. This batch adds real (vulnerable, fixed) pairs of ONE
# function for the six families the engine compiles (access_control, deserialization, injection, output_encoding,
# path, untrusted_destination), mined at zero model cost from reviewed GitHub advisories (pip, npm, maven, composer),
# newest first, so most were published after 2026-06-01 (`post_cutoff = true`) and memorisation can be measured.
#
# Every pair: a reviewed GHSA advisory whose single fix commit (one parent) is linked from the advisory; at most 4
# non-test source files and 120 changed source lines (the fix, not a refactor); the function the commit changes most
# is declared exactly once on both sides (the label builder's matcher, learn.excerpt.function_bounds) and its body
# differs. The positive is that function at `parent`, the negative the same function at `commit`. The function is
# chosen by changed lines, not read from the advisory text: `provenance = "agent"`, `fix_lines` records the counts.
# Repositories: permissive licences only (SPDX from the API), none named anywhere else under benchmarks/ (populations
# v1/v2, every pair corpus), no WordPress plugin, and the reserved-population test passes. Go and Ruby were not taken
# (their excerpts fall outside the feature vocabulary's languages, 2026-10-02 record).
#
# Pointer pairs (vendored = false), the advisory-fixes slice and cache layout: materialize.py --catalog <this file>
# verifies the cached excerpts (verification.json beside this file). Screening record:
# benchmarks/measurements/2026-10-03-decision-engine-negatives-harvest/record.json. `split` alternates train/holdout
# by fix date within each family; one pair per repository.

