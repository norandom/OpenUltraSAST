# Obligated operations and dischargers for JavaScript web code (authorization-obligations, Req 1). Closed data.
version = "1"
language = "javascript"

[[operation]]
id = "orm-read"
kind = "protected_read"
calls = ["findOne", "findById", "findMany", "findFirst", "findUnique", "findAll", "findByPk", "where", "aggregate"]
requires = ["identity_constraint", "ownership_check"]
sensitivity = "high"

[[operation]]
id = "orm-write"
kind = "protected_write"
calls = ["updateOne", "updateMany", "deleteOne", "deleteMany", "findByIdAndUpdate", "findByIdAndDelete", "upsert", "insertOne", "insertMany", "prisma.update", "prisma.delete", "prisma.create"]
requires = ["identity_constraint", "ownership_check"]
sensitivity = "high"

[[operation]]
id = "sql-access"
kind = "protected_read"
calls = ["query", "execute", "raw", "run"]
requires = ["identity_constraint"]
sensitivity = "high"

[[operation]]
id = "privileged-action"
kind = "privileged_action"
calls = ["setRole", "grant", "revoke", "promote", "transfer", "payout", "deleteUser", "resetPassword", "unlink", "rm"]
requires = ["path_guard", "ownership_check"]
sensitivity = "high"

[[operation]]
id = "security-setting"
kind = "security_setting"
calls = ["cors", "cookie", "session", "helmet", "app.listen", "setHeader", "createClient"]
resource_arg = 0
requires = ["non_permissive_value"]
sensitivity = "medium"

[[operation]]
# Template auto-escaping, which is the setting NodeGoat's cross-site scripting actually turns off:
# `swig.setDefaults({ autoescape: false })` at server.js:135, with `autoescape: true` sitting commented out
# directly beneath it. The 2026-09-19 family census recorded output encoding completing 44 questions on that
# repository and finding nothing, because escaping there is a property of the engine's configuration rather
# than of any call a value flows into. It is a value-shaped defect, so it is claimed here rather than by a
# flow, and `output_encoding` states this limit in its own declaration.
id = "template-escaping"
kind = "security_setting"
calls = ["swig.setDefaults", "nunjucks.configure", "marked.setOptions"]
resource_arg = 0
requires = ["non_permissive_value"]
sensitivity = "medium"

[[discharger]]
id = "route-guard"
kind = "path_guard"
calls = ["authenticate", "requireAuth", "ensureAuthenticated", "isAuthenticated", "verifyToken", "checkAuth", "protect", "authorize", "requireUser", "getServerSession", "auth", "withAuth", "jwt.verify", "passport.authenticate"]
decorators = ["UseGuards", "Authorized", "Roles"]

[[discharger]]
id = "identity-from-context"
kind = "identity_constraint"
identity_sources = ["req.user", "request.user", "ctx.user", "session.user", "locals.user", "auth.uid", "auth().userId", "currentUser", "user.id", "token.sub", "decoded.sub", "session.userId", "getServerSession("]
constraint_params = ["userId", "user_id", "ownerId", "owner_id", "authorId", "author_id", "accountId", "tenantId", "createdBy", "user", "owner"]
request_sources = ["req.body", "req.query", "req.params", "request.body", "request.query", "req.headers", "req.cookies", "searchParams", "formData("]

[[discharger]]
id = "ownership-check"
kind = "ownership_check"
calls = ["isOwner", "checkOwner", "assertOwner", "canAccess", "can", "hasPermission", "assertUser", "ownsResource"]

[[discharger]]
id = "safe-setting"
kind = "non_permissive_value"
calls = ["cors", "cookie", "session", "helmet", "setHeader"]
permissive_values = ["'*'", "\"*\"", "true", "0.0.0.0", "null", "false", "origin: true", "secure: false", "httpOnly: false"]

[[discharger]]
# The polarity of a boolean belongs to the setting, not to the language. `true` leaves the door open in
# `cors({origin: true})` and closes it in `swig.setDefaults({autoescape: true})`, so these settings carry
# their OWN permissive value rather than sharing the general one -- which holds both `true` and `false`, and
# would have reported NodeGoat's commented-out fix as the defect.
id = "safe-template-escaping"
kind = "non_permissive_value"
calls = ["swig.setDefaults", "nunjucks.configure", "marked.setOptions"]
permissive_values = ["false"]

[[discharger]]
id = "validated-input"
kind = "validated_input"
calls = ["parse", "safeParse", "validate", "validateSync", "sanitize", "escape", "validationResult", "z.object", "assert"]
