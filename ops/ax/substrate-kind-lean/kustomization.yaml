apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# prepare-substrate.py stages the upstream kind overlay beside this directory.
resources:
  - ../kind-upstream
patches:
  - target:
      namespace: otel-system
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: unused
  - target:
      kind: Namespace
      name: otel-system
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: otel-system
  - target:
      kind: ClusterRole
      name: ate-prometheus
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: ate-prometheus
  - target:
      kind: RoleBinding
      name: ate-prometheus
      namespace: ate-system
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: ate-prometheus
        namespace: ate-system
  - path: ate-otel-config.yaml
